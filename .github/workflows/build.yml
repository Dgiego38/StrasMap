name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App
        run: |
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0 --product StrasbourgMap

      - name: Create iOS Payload
        run: |
          # 1. Créer l'arborescence Payload standard pour iOS
          mkdir -p Payload/StrasbourgMap.app
          
          # 2. Récupérer et copier le binaire iOS compilé
          IOS_BIN=$(find .build -name "StrasbourgMap" -type f | head -n 1)
          if [ -n "$IOS_BIN" ]; then
            cp "$IOS_BIN" Payload/StrasbourgMap.app/StrasbourgMap
            chmod +x Payload/StrasbourgMap.app/StrasbourgMap
          else
            echo "Erreur: Binaire iOS introuvable !"
            exit 1
          fi
          
          # 3. Copier le Info.plist principal
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/StrasbourgMap.app/Info.plist
          else
            echo "Erreur: Info.plist principal introuvable à la racine !"
            exit 1
          fi

          # 4. Compiler et intégrer le catalogue d'actifs (Assets.xcassets -> Assets.car + icônes)
          if [ -d "StrasbourgMap/Assets.xcassets" ]; then
            echo "Compilation du catalogue d'actifs..."
            xcrun actool StrasbourgMap/Assets.xcassets \
              --compile Payload/StrasbourgMap.app \
              --platform iphoneos \
              --minimum-deployment-target 17.0 \
              --app-icon AppIcon \
              --output-format human-readable-text
          else
            echo "Attention: Assets.xcassets introuvable, pas d'icône intégrée."
          fi

          # 5. Nettoyer et zipper l'IPA
          find Payload -name ".DS_Store" -delete
          zip -r StrasbourgMap.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa