name: Build Universal IPA (iOS & WatchOS)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App
        run: |
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0 --product StrasbourgMap

      - name: Build Watch App
        run: |
          swift build -c release --sdk $(xcrun --sdk watchos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-watchos10.0 --product WatchApp || true

      - name: Create Payload and Structure IPA
        run: |
          mkdir -p Payload/StrasbourgMap.app
          
          # Copie l'exécutable iOS
          if [ -f ".build/arm64-apple-ios/release/StrasbourgMap" ]; then
            cp .build/arm64-apple-ios/release/StrasbourgMap Payload/StrasbourgMap.app/StrasbourgMap
          elif [ -f ".build/release/StrasbourgMap" ]; then
            cp .build/release/StrasbourgMap Payload/StrasbourgMap.app/StrasbourgMap
          fi
          
          # Ajoute l'Info.plist
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/StrasbourgMap.app/Info.plist
          fi

          # Crée l'archive .ipa finale
          zip -r StrasbourgMap.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa