name: Build and Generate IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode Project
        run: |
          xcodebuild -project StrasbourgMap.xcodeproj \
                     -scheme StrasbourgMap \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     build

      - name: Create Payload and Bundle Info.plist
        run: |
          mkdir -p Payload/StrasbourgMap.app
          
          # Cherche l'app compilée et copie-la dans le Payload
          APP_PATH=$(find build -name "StrasbourgMap.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH"/* Payload/StrasbourgMap.app/
          fi
          
          # S'assure que le fichier Info.plist est bien présent
          if [ -f "Info.plist" ] && [ ! -f "Payload/StrasbourgMap.app/Info.plist" ]; then
            cp Info.plist Payload/StrasbourgMap.app/Info.plist
          fi

          # Compresse en IPA
          zip -r StrasbourgMap.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa