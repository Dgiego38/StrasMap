name: Build Independent IPAs (iOS & WatchOS)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App
        run: |
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0 --product StrasbourgMap

      - name: Build Watch App
        run: |
          swift build -c release --sdk $(xcrun --sdk watchos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-watchos10.0 --product WatchApp

      - name: Create Independent IPAs
        run: |
          # --- 1. CRÉATION DE L'IPA IOS ---
          mkdir -p Payload/StrasbourgMap.app
          
          IOS_BIN=$(find .build -name "StrasbourgMap" -type f | grep -v "arm64-apple-watchos" | head -n 1)
          if [ -n "$IOS_BIN" ]; then
            cp "$IOS_BIN" Payload/StrasbourgMap.app/StrasbourgMap
          else
            echo "Erreur: Binaire iOS introuvable !"
            exit 1
          fi
          
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/StrasbourgMap.app/Info.plist
          fi
          
          find Payload -name ".DS_Store" -delete
          zip -r StrasbourgMap-iOS.ipa Payload
          rm -rf Payload

          # --- 2. CRÉATION DE L'IPA WATCHOS ---
          mkdir -p Payload/WatchApp.app
          
          WATCH_BIN=$(find .build -name "WatchApp" -type f | head -n 1)
          if [ -n "$WATCH_BIN" ]; then
            cp "$WATCH_BIN" Payload/WatchApp.app/WatchApp
            chmod +x Payload/WatchApp.app/WatchApp
          else
            echo "Erreur: Binaire WatchApp introuvable !"
            exit 1
          fi
          
          if [ -f "WatchApp-Info.plist" ]; then
            cp WatchApp-Info.plist Payload/WatchApp.app/Info.plist
          fi
          
          find Payload -name ".DS_Store" -delete
          zip -r StrasbourgMap-Watch.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPAs
          path: |
            StrasbourgMap-iOS.ipa
            StrasbourgMap-Watch.ipa