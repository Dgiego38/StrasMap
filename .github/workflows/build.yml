name: Build Universal IPA (iOS & WatchOS)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App
        run: |
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0 --product StrasbourgMap

      - name: Build Watch App
        run: |
          swift build -c release --sdk $(xcrun --sdk watchos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-watchos10.0 --product WatchApp

      - name: Create Payload and Structure IPA
        run: |
          # Créer l'arborescence complète pour l'iOS et la Watch app empaquetée
          mkdir -p Payload/StrasbourgMap.app/Watch/WatchApp.app
          
          # 1. Copie l'exécutable iOS principal (recherche automatique)
          IOS_BIN=$(find .build -name "StrasbourgMap" -type f | grep -v "arm64-apple-watchos" | head -n 1)
          if [ -n "$IOS_BIN" ]; then
            cp "$IOS_BIN" Payload/StrasbourgMap.app/StrasbourgMap
          else
            echo "Erreur: Binaire iOS introuvable !"
            exit 1
          fi
          
          # Ajoute l'Info.plist de l'app iOS
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/StrasbourgMap.app/Info.plist
          fi

          # 2. Copie l'exécutable de la Watch App dans le sous-dossier "Watch" (recherche automatique)
          WATCH_BIN=$(find .build -name "WatchApp" -type f | head -n 1)
          if [ -n "$WATCH_BIN" ]; then
            cp "$WATCH_BIN" Payload/StrasbourgMap.app/Watch/WatchApp.app/WatchApp
          else
            echo "Erreur: Binaire WatchApp introuvable !"
            exit 1
          fi

          # Ajoute le plist spécifique de la Watch App
          if [ -f "WatchApp-Info.plist" ]; then
            cp WatchApp-Info.plist Payload/StrasbourgMap.app/Watch/WatchApp.app/Info.plist
          fi

          # 3. Crée l'archive .ipa finale
          zip -r StrasbourgMap.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa