name: Build and Generate IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS Executable
        run: |
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload/StrasbourgMap.app
          # Copie le binaire compilé par Swift Package Manager
          cp .build/arm64-apple-ios/release/StrasbourgMap Payload/StrasbourgMap.app/StrasbourgMap || cp .build/release/StrasbourgMap Payload/StrasbourgMap.app/StrasbourgMap
          
          # Compresse en IPA
          zip -r StrasbourgMap.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa