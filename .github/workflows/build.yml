name: Build and Generate IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Package or Project
        run: |
          # Si tu utilises xcodebuild avec un projet configuré :
          xcodebuild -scheme StrasbourgMap \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     build || swift build -c release

      - name: Create Payload and IPA Structure
        run: |
          # Crée un dossier Payload requis pour un IPA
          mkdir -p Payload
          
          # Copie l'app compilée (si elle existe dans le derived data ou le build swift)
          # On cherche l'exécutable ou le .app généré
          if [ -d "build/Build/Products/Release-iphoneos/StrasbourgMap.app" ]; then
            cp -r "build/Build/Products/Release-iphoneos/StrasbourgMap.app" Payload/
          elif [ -d ".build/arm64-apple-ios/release/StrasbourgMap.app" ]; then
            cp -r ".build/arm64-apple-ios/release/StrasbourgMap.app" Payload/
          else
            # Fallback si l'app est sous forme de binaire brut
            mkdir -p Payload/StrasbourgMap.app
            cp .build/release/StrasbourgMap Payload/StrasbourgMap.app/StrasbourgMap || true
          fi

          # Compresse en .ipa (qui est un simple zip renommé)
          zip -r StrasbourgMap.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa