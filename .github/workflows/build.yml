name: Build and Export IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      # 1. Si tu utilises xcodebuild avec un projet/workspace minimal
      - name: Build and Archive
        run: |
          xcodebuild -scheme StrasbourgMap \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/StrasbourgMap.xcarchive \
                     archive

      # 2. Exportation de l'archive en .ipa (sans signature pour l'instant, idéal pour le build cloud)
      - name: Export IPA
        run: |
          mkdir -p build/IPA
          # Note: Pour un export sans compte Apple Developer payant, 
          # on peut récupérer le binaire compilé ou configurer un export ad-hoc.
          
      # 3. Sauvegarde du build dans les artefacts GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-Build
          path: build/