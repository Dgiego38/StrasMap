name: Build Universal IPA (iOS & WatchOS Embedded)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App
        run: |
          swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0 --product StrasbourgMap

      - name: Build Watch App
        run: |
          swift build -c release --sdk $(xcrun --sdk watchos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-watchos10.0 --product WatchApp

      - name: Create Nested Payload with Watch Extension Structure
        run: |
          # 1. Créer l'arborescence complète exigée par iOS
          mkdir -p Payload/StrasbourgMap.app/Watch/WatchApp.app/PlugIns/WatchAppExtension.appex
          
          # 2. Copier le binaire et le plist iOS
          IOS_BIN=$(find .build -name "StrasbourgMap" -type f | grep -v "arm64-apple-watchos" | head -n 1)
          if [ -n "$IOS_BIN" ]; then
            cp "$IOS_BIN" Payload/StrasbourgMap.app/StrasbourgMap
            chmod +x Payload/StrasbourgMap.app/StrasbourgMap
          else
            echo "Erreur: Binaire iOS introuvable !"
            exit 1
          fi
          
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/StrasbourgMap.app/Info.plist
          else
            echo "Erreur: Info.plist principal introuvable à la racine !"
            exit 1
          fi

          # 3. Récupérer le binaire WatchApp compilé
          WATCH_BIN=$(find .build -name "WatchApp" -type f | head -n 1)
          if [ -z "$WATCH_BIN" ]; then
            echo "Erreur: Binaire WatchApp introuvable !"
            exit 1
          fi

          # Copier et rendre exécutables les binaires watchOS et son extension
          cp "$WATCH_BIN" Payload/StrasbourgMap.app/Watch/WatchApp.app/WatchApp
          cp "$WATCH_BIN" Payload/StrasbourgMap.app/Watch/WatchApp.app/PlugIns/WatchAppExtension.appex/WatchAppExtension
          chmod +x Payload/StrasbourgMap.app/Watch/WatchApp.app/WatchApp
          chmod +x Payload/StrasbourgMap.app/Watch/WatchApp.app/PlugIns/WatchAppExtension.appex/WatchAppExtension

          # 4. Gérer le plist Watch et lier les identifiants dynamiquement
          if [ -f "WatchApp-Info.plist" ]; then
            cp WatchApp-Info.plist Payload/StrasbourgMap.app/Watch/WatchApp.app/Info.plist
          else
            # Créer un Info.plist minimaliste pour l'app Watch si absent
            cat << 'EOF' > Payload/StrasbourgMap.app/Watch/WatchApp.app/Info.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleIdentifier</key>
                <string>com.strasbourg.map.watchkitapp</string>
                <key>CFBundleExecutable</key>
                <string>WatchApp</string>
                <key>CFBundleName</key>
                <string>WatchApp</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
            </dict>
            </plist>
            EOF
          fi

          # Récupération propre du Bundle ID iOS et mise en correspondance Watch
          IOS_BUNDLE_ID=$(defaults read "$(pwd)/Payload/StrasbourgMap.app/Info.plist" CFBundleIdentifier)
          if [ -n "$IOS_BUNDLE_ID" ]; then
            /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier $IOS_BUNDLE_ID" Payload/StrasbourgMap.app/Watch/WatchApp.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :WKCompanionAppBundleIdentifier string $IOS_BUNDLE_ID" Payload/StrasbourgMap.app/Watch/WatchApp.app/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $IOS_BUNDLE_ID.watchkitapp" Payload/StrasbourgMap.app/Watch/WatchApp.app/Info.plist
          fi

          # Créer un Info.plist propre pour l'extension .appex de la montre
          cat << EOF > Payload/StrasbourgMap.app/Watch/WatchApp.app/PlugIns/WatchAppExtension.appex/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>${IOS_BUNDLE_ID}.watchkitapp.watchkitextension</string>
              <key>CFBundleExecutable</key>
              <string>WatchAppExtension</string>
              <key>CFBundleName</key>
              <string>WatchApp Extension</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>NSExtension</key>
              <dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.watchkit</string>
              </dict>
          </dict>
          </plist>
          EOF

          # 5. Nettoyer les fichiers superflus et zipper l'IPA
          find Payload -name ".DS_Store" -delete
          zip -r StrasbourgMap.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrasbourgMap-IPA
          path: StrasbourgMap.ipa